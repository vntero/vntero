<svg xmlns="http://www.w3.org/2000/svg" width="420" height="358" viewBox="0 0 420 358" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <style>
    .title { fill: #58a6ff; font-size: 16px; font-weight: 600; }
    .label { fill: #c9d1d9; font-size: 13px; }
    .pct { fill: #8b949e; font-size: 12px; }
    .track { fill: #21262d; }
    svg { background-color: #0d1117; }
  </style>
  <rect width="420" height="358" rx="8" fill="#0d1117" />
  <text x="20" y="28" class="title">Most Used Languages</text>
  
    <text x="20" y="65" class="label">Svelte</text>
    <rect x="150" y="54" width="210" height="10" rx="5" class="track" />
    <rect x="150" y="54" width="64.59966745372759" height="10" rx="5" fill="#ff3e00">
      <animate attributeName="width" from="0" to="64.59966745372759" dur="0.8s" fill="freeze" />
    </rect>
    <text x="370" y="65" class="pct">30.8%</text>

